services:
  # Re-train from the raw CSV: docker compose run --rm train
  train:
    build: .
    command: python -m src.pipeline
    user: root
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./reports:/app/reports
    profiles: ["train"]

  # Serve the model:  docker compose up api (http://localhost:8000)
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENT_EMAIL: ${AGENT_EMAIL:-amalia@higherstudies.com}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-Dem0123!}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret}
    volumes:
      - ./models:/app/models:ro
      - ./outputs:/app/outputs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

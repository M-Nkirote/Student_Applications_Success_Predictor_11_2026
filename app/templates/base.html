<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Enrolment outlook{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pacifico&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', path='icon.png') }}">
</head>

<body class="{% block body_class %}{% endblock %}">
  {% block header %}
  <header class="topbar">
    <a class="brand" href="/">Higher Studies Inc. - Applications' Success Outlook</a>
    {% if agent %}
    <nav aria-label="Main">
      <a href="/score">Score an application</a>
      <a href="/pipeline">Open pipeline</a>
      <a href="/logout">Log out</a>
    </nav>
    {% endif %}
  </header>
  {% endblock %}

  {% block main %}
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>

</html>
